name: Secret scan

# Fails a push or pull request that adds a secret. Scans only the commits the
# event adds, so findings already in history do not block unrelated work.
# A first push (no previous commit to compare with) scans all pushed history.
# Rules: .gitleaks.toml (gitleaks built-ins + this repo's own rules).
# False positive on a line you must keep: end that line with a
# `gitleaks:allow` comment, or add its fingerprint to .gitleaksignore.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

# A newer PR push cancels the older run. Each push to the default branch gets
# its own group (by sha): GitHub drops a pending run when a newer one joins its
# group, which would leave a middle push range unscanned.
concurrency:
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan the commits this event adds
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "$zero" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # First push, new branch or unknown base: scan everything HEAD
            # reaches (also covers a root commit, which has no HEAD~1).
            range="${HEAD_SHA}"
          else
            range="${BASE_SHA}..${HEAD_SHA}"
          fi
          echo "Scanning ${range}"
          gitleaks git --redact --verbose --no-banner --config .gitleaks.toml --log-opts="${range}" .
